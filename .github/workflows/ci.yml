name: Build and test
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: python3 scripts/cli-smoke.py
      - name: Public relay without direct UDP
        if: runner.os == 'Linux'
        run: cargo test -p famasock --test relay --locked -- --ignored
      - name: Real Linux TUN forwarding
        if: runner.os == 'Linux'
        run: sudo python3 scripts/vpn-kernel.py
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
          cache-on-failure: true
      - name: Verify generated project
        run: python3 scripts/generate-xcode.py && git diff --exit-code apps/ios/Famasock.xcodeproj
      - name: Build native app and extension for device (unsigned)
        run: >-
          xcodebuild -project apps/ios/Famasock.xcodeproj -scheme Famasock
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath DerivedData/device ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Build native app and extension for simulator
        run: >-
          xcodebuild -project apps/ios/Famasock.xcodeproj -scheme Famasock
          -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData/simulator ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: Famasock-unsigned-device-and-simulator
          path: DerivedData/*/Build/Products/Release-*/*.app

[workspace]
members = ["crates/famasock", "crates/famasock-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }

[profile.release]
lto = "thin"
strip = "debuginfo"

# netdev 0.46.3's Darwin IPv6 flags code uses a libc type unavailable on iOS.
# Remove this source patch once upstream supports the iOS request layout.
[patch.crates-io]
netdev = { path = "vendor/netdev" }
